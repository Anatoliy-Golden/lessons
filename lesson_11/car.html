<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- локальное подключение шрифтов -->
    <link rel="stylesheet" href="css/fonts.css" />

    <!-- сброс стилей браузера -->
    <link rel="stylesheet" href="css/reset.css" />

    <!-- подключение файла css к html -->
    <link rel="stylesheet" href="css/style.css" />
    <title>Lesson 11</title>
  </head>
  <body>
    <div class="wrapper">
      <!-- page -->
      <main class="page">
        <div class="car">
          <div class="car__container">
            <div class="car__items">
              <!-- body -->
              <div class="car__body body">
                <div class="body__item-1"></div>
                <div class="body__item-2"></div>
                <div class="body__item-3"></div>
                <div class="body__item-4"></div>
                <div class="body__item-5"></div>
              </div>
              <!-- spoiler -->
              <div class="car__spoiler spoiler">
                <div class="spoiler__item-1"></div>
                <div class="spoiler__item-2"></div>
                <div class="spoiler__item-3"></div>
                <div class="spoiler__item-4"></div>
              </div>
              <!-- hood -->
              <div class="car__hood hood">
                <div class="hood__item-1"></div>
                <div class="hood__item-2"></div>
                <div class="hood__item-3"></div>
              </div>
              <!-- weels -->
              <div class="car__weels weels">
                <div class="weels__item"></div>
                <div class="weels__item"></div>
              </div>
              <!--  -->
              <div class="car__top top">
                <div class="top__item"></div>
                <div class="top__item"></div>
                <div class="top__item-circle"></div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
