<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- локальное подключение шрифтов -->
    <link rel="stylesheet" href="css/fonts.css" />

    <!-- сброс стилей браузера -->
    <link rel="stylesheet" href="css/reset.css" />

    <!-- подключение файла css к html -->
    <link rel="stylesheet" href="css/style.css" />
    <title>Lesson 11</title>
  </head>
  <body>
    <div class="wrapper">
      <!-- header -->
      <header class="header">
        <div class="header__container">
          <h1 class="header__title">transform</h1>
        </div>
      </header>

      <!-- page -->
      <main class="page">
        <div class="property">
          <div class="property__container">
            <!--  -->
            <div class="property__item">
              <div class="property__example example">
                <!-- translate -->
                <div class="example__item">
                  <div class="example__property example__property--translate">translate</div>
                </div>

                <!-- transform-scale -->
                <div class="example__item">
                  <div class="example__property example__property--scale">scale</div>
                </div>

                <!-- rotate -->
                <div class="example__item">
                  <div class="example__property example__property--rotate">rotate</div>
                </div>

                <!-- skew -->
                <div class="example__item">
                  <div class="example__property example__property--skew">skew</div>
                </div>

                <!-- multiple-transform -->
                <div class="example__item">
                  <div class="example__property example__property--multiple-transform">multiple-transform</div>
                </div>

                <!-- transform-origin -->
                <div class="example__item">
                  <div class="example__property example__property--transform-origin">transform-origin</div>
                </div>

                <!-- translate-3d -->
                <div class="example__item example__item--3d">
                  <div class="example__property example__property--translate-3d">translate 3d</div>
                </div>

                <!-- rotate-3d -->
                <div class="example__item example__item--3d">
                  <div class="example__property example__property--rotate-3d">rotate 3d</div>
                </div>

                <!-- multiple-transform 3d -->
                <div class="example__item example__item--3d">
                  <div class="example__property example__property--multiple-transform-3d">multiple-transform 3d</div>
                </div>
              </div>
            </div>

            <div class="property__action action">
              <a class="action__button button" href="car.html"><span>next page</span></a>
            </div>
          </div>
        </div>
      </main>

      <!-- footer -->
      <footer class="footer">
        <div class="footer__container"></div>
      </footer>
    </div>
  </body>
</html>
